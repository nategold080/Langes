    function Icon({ name, size, color, strokeWidth }) {
      var s = size || 24;
      var c = color || "currentColor";
      var sw = strokeWidth || 1.5;
      var ref = React.useRef(null);
      React.useEffect(function() {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          var svg = lucide.icons[name].toSvg({ width: s, height: s, color: c, 'stroke-width': sw });
          ref.current.innerHTML = svg;
        }
      }, [name, s, c, sw]);
      return React.createElement('span', {
        ref: ref,
        style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: s, height: s }
      });
    }

    /* ============================================================
       HELPER: isStoreOpen
       ============================================================ */
    function isStoreOpen() {
      var now = new Date();
      var day = now.getDay();
      var hours = STORE_HOURS[day];
      var currentMin = now.getHours() * 60 + now.getMinutes();
      return currentMin >= hours.openMin && currentMin < hours.closeMin;
    }

    /* ============================================================
       REDUCER
       ============================================================ */
    var initialState = {
      activeView: "home",
      cart: [],
      cartNote: "",
      builder: {
        step: 0,
        bread: null,
        meat: null,
        cheese: null,
        toppings: [],
        condiments: [],
        name: ""
      },
      menuCategory: "hotFoods",
      orderConfirmation: null,
      cateringForm: {
        date: "",
        guests: "",
        categories: [],
        dietary: "",
        notes: "",
        name: "",
        phone: "",
        email: ""
      },
      toastMessage: null
    };

    function reducer(state, action) {
      switch (action.type) {
        case "SET_VIEW":
          return Object.assign({}, state, { activeView: action.payload });

        case "ADD_TO_CART":
          var newItem = {
            cartId: Date.now(),
            id: action.payload.id,
            name: action.payload.name,
            description: action.payload.description,
            quantity: 1,
            type: action.payload.type
          };
          return Object.assign({}, state, {
            cart: state.cart.concat([newItem]),
            toastMessage: "Added to order"
          });

        case "REMOVE_FROM_CART":
          return Object.assign({}, state, {
            cart: state.cart.filter(function(item) { return item.cartId !== action.payload; })
          });

        case "UPDATE_QUANTITY":
          if (action.payload.quantity <= 0) {
            return Object.assign({}, state, {
              cart: state.cart.filter(function(item) { return item.cartId !== action.payload.cartId; })
            });
          }
          return Object.assign({}, state, {
            cart: state.cart.map(function(item) {
              if (item.cartId === action.payload.cartId) {
                return Object.assign({}, item, { quantity: action.payload.quantity });
              }
              return item;
            })
          });

        case "SET_CART_NOTE":
          return Object.assign({}, state, { cartNote: action.payload });

        case "CLEAR_CART":
          return Object.assign({}, state, { cart: [], cartNote: "" });

        case "SET_BUILDER_STEP":
          return Object.assign({}, state, {
            builder: Object.assign({}, state.builder, { step: action.payload })
          });

        case "SET_BUILDER_SELECTION":
          var field = action.payload.field;
          var value = action.payload.value;
          if (field === "toppings" || field === "condiments") {
            var arr = state.builder[field];
            var idx = arr.indexOf(value);
            var newArr;
            if (idx > -1) {
              newArr = arr.filter(function(v) { return v !== value; });
            } else {
              newArr = arr.concat([value]);
            }
            var builderUpdate = {};
            builderUpdate[field] = newArr;
            return Object.assign({}, state, {
              builder: Object.assign({}, state.builder, builderUpdate)
            });
          }
          var singleUpdate = {};
          singleUpdate[field] = value;
          return Object.assign({}, state, {
            builder: Object.assign({}, state.builder, singleUpdate)
          });

        case "RESET_BUILDER":
          return Object.assign({}, state, {
            builder: {
              step: 0,
              bread: null,
              meat: null,
              cheese: null,
              toppings: [],
              condiments: [],
              name: ""
            }
          });

        case "ADD_BYO_TO_CART":
          var b = state.builder;
          var parts = [b.bread, b.meat, b.cheese].filter(Boolean);
          if (b.toppings.length > 0) parts = parts.concat(b.toppings);
          if (b.condiments.length > 0) parts = parts.concat(b.condiments);
          var byoItem = {
            cartId: Date.now(),
            id: "byo-" + Date.now(),
            name: b.name || "Custom Sandwich",
            description: parts.join(", "),
            quantity: 1,
            type: "byo"
          };
          return Object.assign({}, state, {
            cart: state.cart.concat([byoItem]),
            builder: {
              step: 0,
              bread: null,
              meat: null,
              cheese: null,
              toppings: [],
              condiments: [],
              name: ""
            },
            toastMessage: "Added to order"
          });

        case "SET_MENU_CATEGORY":
          return Object.assign({}, state, { menuCategory: action.payload });

        case "PLACE_ORDER":
          var orderNum = "LS-" + String(Math.floor(1000 + Math.random() * 9000));
          return Object.assign({}, state, {
            orderConfirmation: {
              orderNumber: orderNum,
              items: state.cart.slice(),
              note: state.cartNote,
              timestamp: new Date().toISOString()
            },
            cart: [],
            cartNote: ""
          });

        case "CLEAR_CONFIRMATION":
          return Object.assign({}, state, { orderConfirmation: null });

        case "UPDATE_CATERING_FORM":
          return Object.assign({}, state, {
            cateringForm: Object.assign({}, state.cateringForm, action.payload)
          });

        case "RESET_CATERING_FORM":
          return Object.assign({}, state, {
            cateringForm: {
              date: "",
              guests: "",
              categories: [],
              dietary: "",
              notes: "",
              name: "",
              phone: "",
              email: ""
            }
          });

        case "CLEAR_TOAST":
          return Object.assign({}, state, { toastMessage: null });

        default:
          return state;
      }
    }

          </span>
          <div
            onClick={function() { dispatch({ type: "SET_VIEW", payload: "cart" }); }}
            style={{
              position: 'relative',
              cursor: 'pointer',
              minWidth: '44px',
              minHeight: '44px',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center'
            }}
            className="active:opacity-70"
          >
            <Icon name="shopping-cart" size={24} color="#333" />
            {cartCount > 0 && (
              <span
                style={{
                  position: 'absolute',
                  top: '4px',
                  right: '2px',
                  background: '#C23B22',
                  color: 'white',
                  fontSize: '12px',
                  fontWeight: '600',
                  borderRadius: '9999px',
                  minWidth: '18px',
                  height: '18px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  lineHeight: 1,
                  padding: '0 5px'
                }}
              >
                {cartCount}
              </span>
            )}
          </div>
        </div>
      );
    }

    /* ============================================================
       TAB BAR COMPONENT
       ============================================================ */
    function TabBar({ state, dispatch }) {
      var cartCount = state.cart.reduce(function(sum, item) { return sum + item.quantity; }, 0);
      var tabs = [
        { icon: "home", label: "Home", view: "home" },
        { icon: "book-open", label: "Menu", view: "menu" },
        { icon: "sandwich", label: "Build", view: "builder" },
        { icon: "shopping-cart", label: "Order", view: "cart" },
        { icon: "party-popper", label: "Catering", view: "catering" }
      ];
      return (
        <div
          style={{
            position: 'fixed',
            bottom: 0,
            left: '50%',
            transform: 'translateX(-50%)',
            width: '100%',
            maxWidth: '448px',
            zIndex: 50,
            height: '49px',
            paddingBottom: 'env(safe-area-inset-bottom)',
            background: 'rgba(255,255,255,0.85)',
            backdropFilter: 'blur(20px)',
            WebkitBackdropFilter: 'blur(20px)',
            borderTop: '0.5px solid rgba(60,60,67,0.12)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-around'
          }}
        >
          {tabs.map(function(tab) {
            var isActive = state.activeView === tab.view;
            var color = isActive ? '#C23B22' : '#999';
            return (
              <div
                key={tab.view}
                onClick={function() { dispatch({ type: "SET_VIEW", payload: tab.view }); }}
                className="active:opacity-70"
                style={{
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  justifyContent: 'center',
                  cursor: 'pointer',
                  minWidth: '44px',
                  minHeight: '44px',
                  position: 'relative',
                  flex: 1
                }}
              >
                <div style={{ position: 'relative' }}>
                  <Icon name={tab.icon} size={25} color={color} />
                  {tab.view === "cart" && cartCount > 0 && (
                    <span
                      style={{
                        position: 'absolute',
                        top: '-4px',
                        right: '-8px',
                        background: '#C23B22',
                        color: 'white',
                        fontSize: '11px',
                        fontWeight: '600',
                        borderRadius: '9999px',
                        minWidth: '16px',
                        height: '16px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        lineHeight: 1,
                        padding: '0 4px'
                      }}
                    >
                      {cartCount}
                    </span>
                  )}
                </div>
                <span style={{ fontSize: '10px', color: color, marginTop: '2px', fontWeight: isActive ? '600' : '400' }}>
                  {tab.label}
                </span>
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================================================
       TOAST COMPONENT
       ============================================================ */
    function Toast({ message }) {
      if (!message) return null;
      return (
        <div
          style={{
            position: 'fixed',
            top: 'calc(44px + env(safe-area-inset-top) + 12px)',
            left: '50%',
            transform: 'translateX(-50%)',
            zIndex: 60,
            background: '#C23B22',
            color: 'white',
            fontSize: '15px',
            fontWeight: '500',
            borderRadius: '9999px',
            padding: '8px 16px',
            whiteSpace: 'nowrap',
            boxShadow: '0 4px 12px rgba(0,0,0,0.15)'
          }}
        >
          {message}
        </div>
      );
    }

    /* ============================================================
       PLACEHOLDER VIEW COMPONENT
       ============================================================ */
    function PlaceholderView({ title }) {
      return (
        <div style={{
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          minHeight: 'calc(100vh - 44px - 49px - env(safe-area-inset-top) - env(safe-area-inset-bottom))',
          padding: '20px'
        }}>
          <h1 style={{ fontSize: '22px', fontWeight: '700', color: '#000', margin: '0 0 8px 0' }}>
            {title}
          </h1>
          <p style={{ fontSize: '15px', color: '#8E8E93', margin: 0 }}>
            Coming soon
          </p>
        </div>
      );
    }

    /* ============================================================
       MAIN APP COMPONENT
       ============================================================ */
    function LangesApp() {
      var ref = React.useReducer(reducer, initialState);
      var state = ref[0];
      var dispatch = ref[1];
      var contentRef = React.useRef(null);

      // Scroll to top on view change
      React.useEffect(function() {
        if (contentRef.current) {
          contentRef.current.scrollTop = 0;
        }
      }, [state.activeView]);

      // Clear toast after 1500ms
      React.useEffect(function() {
        if (state.toastMessage) {
          var timer = setTimeout(function() {
            dispatch({ type: "CLEAR_TOAST" });
          }, 1500);
          return function() { clearTimeout(timer); };
        }
      }, [state.toastMessage]);

      // Determine which view to render
      var viewContent;
      switch (state.activeView) {
        case "home":
          viewContent = <PlaceholderView title="Home" />;
          break;
        case "menu":
          viewContent = <PlaceholderView title="Menu" />;
          break;
        case "builder":
          viewContent = <PlaceholderView title="Build Your Own" />;
          break;
        case "cart":
          viewContent = <PlaceholderView title="Your Order" />;
          break;
        case "catering":
          viewContent = <PlaceholderView title="Catering" />;
          break;
        default:
          viewContent = <PlaceholderView title="Home" />;
      }

      return (
        <div style={{ maxWidth: '448px', margin: '0 auto', position: 'relative', minHeight: '100vh', overflow: 'hidden' }}>
          <Header state={state} dispatch={dispatch} />
          <main
            ref={contentRef}
            className="scroll-area"
            style={{
              flex: 1,
              overflowY: 'auto',
              paddingTop: '0',
              paddingBottom: 'calc(49px + env(safe-area-inset-bottom))',
              background: '#F2F2F7',
              minHeight: 'calc(100vh - 44px - env(safe-area-inset-top))'
            }}
          >
            {viewContent}
          </main>
          <TabBar state={state} dispatch={dispatch} />
          <Toast message={state.toastMessage} />
        </div>
      );
    }

    /* ============================================================
       RENDER
       ============================================================ */
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(LangesApp)
    );
  </script>
</body>
</html>
