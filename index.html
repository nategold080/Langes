    function Icon({ name, size, color, strokeWidth }) {
      var s = size || 24;
      var c = color || "currentColor";
      var sw = strokeWidth || 1.5;
      var ref = React.useRef(null);
      React.useEffect(function() {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          var svg = lucide.icons[name].toSvg({ width: s, height: s, color: c, 'stroke-width': sw });
          ref.current.innerHTML = svg;
        }
      }, [name, s, c, sw]);
      return React.createElement('span', {
        ref: ref,
        style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: s, height: s }
      });
    }

    /* ============================================================
       HELPER: isStoreOpen
       ============================================================ */
    function isStoreOpen() {
      var now = new Date();
      var day = now.getDay();
      var hours = STORE_HOURS[day];
      var currentMin = now.getHours() * 60 + now.getMinutes();
      return currentMin >= hours.openMin && currentMin < hours.closeMin;
    }

    /* ============================================================
       REDUCER
       ============================================================ */
    var initialState = {
      activeView: "home",
      cart: [],
      cartNote: "",
      builder: {
        step: 0,
        bread: null,
        meat: null,
        cheese: null,
        toppings: [],
        condiments: [],
        name: ""
      },
      menuCategory: "hotFoods",
      orderConfirmation: null,
      cateringForm: {
        date: "",
        guests: "",
        categories: [],
        dietary: "",
        notes: "",
        name: "",
        phone: "",
        email: ""
      },
      toastMessage: null
    };

    function reducer(state, action) {
      switch (action.type) {
        case "SET_VIEW":
          return Object.assign({}, state, { activeView: action.payload });

        case "ADD_TO_CART":
          var newItem = {
            cartId: Date.now(),
            id: action.payload.id,
            name: action.payload.name,
            description: action.payload.description,
            quantity: 1,
            type: action.payload.type
          };
          return Object.assign({}, state, {
            cart: state.cart.concat([newItem]),
            toastMessage: "Added to order"
          });

        case "REMOVE_FROM_CART":
          return Object.assign({}, state, {
            cart: state.cart.filter(function(item) { return item.cartId !== action.payload; })
          });

        case "UPDATE_QUANTITY":
          if (action.payload.quantity <= 0) {
            return Object.assign({}, state, {
              cart: state.cart.filter(function(item) { return item.cartId !== action.payload.cartId; })
            });
          }
          return Object.assign({}, state, {
            cart: state.cart.map(function(item) {
              if (item.cartId === action.payload.cartId) {
                return Object.assign({}, item, { quantity: action.payload.quantity });
              }
              return item;
            })
          });

        case "SET_CART_NOTE":
          return Object.assign({}, state, { cartNote: action.payload });

        case "CLEAR_CART":
          return Object.assign({}, state, { cart: [], cartNote: "" });

        case "SET_BUILDER_STEP":
          return Object.assign({}, state, {
            builder: Object.assign({}, state.builder, { step: action.payload })
          });

        case "SET_BUILDER_SELECTION":
          var field = action.payload.field;
          var value = action.payload.value;
          if (field === "toppings" || field === "condiments") {
            var arr = state.builder[field];
            var idx = arr.indexOf(value);
            var newArr;
            if (idx > -1) {
              newArr = arr.filter(function(v) { return v !== value; });
            } else {
              newArr = arr.concat([value]);
            }
            var builderUpdate = {};
            builderUpdate[field] = newArr;
            return Object.assign({}, state, {
              builder: Object.assign({}, state.builder, builderUpdate)
            });
          }
          var singleUpdate = {};
          singleUpdate[field] = value;
          return Object.assign({}, state, {
            builder: Object.assign({}, state.builder, singleUpdate)
          });

        case "RESET_BUILDER":
          return Object.assign({}, state, {
            builder: {
              step: 0,
              bread: null,
              meat: null,
              cheese: null,
              toppings: [],
              condiments: [],
              name: ""
            }
          });

        case "ADD_BYO_TO_CART":
          var b = state.builder;
          var parts = [b.bread, b.meat, b.cheese].filter(Boolean);
          if (b.toppings.length > 0) parts = parts.concat(b.toppings);
          if (b.condiments.length > 0) parts = parts.concat(b.condiments);
          var byoItem = {
            cartId: Date.now(),
            id: "byo-" + Date.now(),
            name: b.name || "Custom Sandwich",
            description: parts.join(", "),
            quantity: 1,
            type: "byo"
          };
          return Object.assign({}, state, {
            cart: state.cart.concat([byoItem]),
            builder: {
              step: 0,
              bread: null,
              meat: null,
              cheese: null,
              toppings: [],
              condiments: [],
              name: ""
            },
            toastMessage: "Added to order"
          });

        case "SET_MENU_CATEGORY":
          return Object.assign({}, state, { menuCategory: action.payload });

        case "PLACE_ORDER":
          var orderNum = "LS-" + String(Math.floor(1000 + Math.random() * 9000));
          return Object.assign({}, state, {
            orderConfirmation: {
              orderNumber: orderNum,
              items: state.cart.slice(),
              note: state.cartNote,
              timestamp: new Date().toISOString()
            },
            cart: [],
            cartNote: ""
          });

        case "CLEAR_CONFIRMATION":
          return Object.assign({}, state, { orderConfirmation: null });

        case "UPDATE_CATERING_FORM":
          return Object.assign({}, state, {
            cateringForm: Object.assign({}, state.cateringForm, action.payload)
          });

        case "RESET_CATERING_FORM":
          return Object.assign({}, state, {
            cateringForm: {
              date: "",
              guests: "",
              categories: [],
              dietary: "",
              notes: "",
              name: "",
              phone: "",
              email: ""
            }
          });

        case "CLEAR_TOAST":
          return Object.assign({}, state, { toastMessage: null });

        default:
          return state;
      }
    }

    /* ============================================================
       BUILDER VIEW COMPONENT
       ============================================================ */
    function BuilderView({ state, dispatch }) {
      var step = state.builder.step;
      var stepNames = ["Bread", "Meat", "Cheese", "Toppings", "Condiments", "Review"];
      var stepKeys = ["bread", "meat", "cheese", "toppings", "condiments"];
      var optionArrays = [BYO_OPTIONS.bread, BYO_OPTIONS.meat, BYO_OPTIONS.cheese, BYO_OPTIONS.toppings, BYO_OPTIONS.condiments];

      var isSingleSelect = step <= 2;
      var isMultiSelect = step === 3 || step === 4;

      function renderDot(i) {
        if (i < step) {
          return (
            <div style={{
              width: '8px', height: '8px', borderRadius: '9999px',
              background: '#2D5016',
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}>
              <span style={{ fontSize: '6px', color: 'white', lineHeight: 1 }}>{"\u2713"}</span>
            </div>
          );
        }
        if (i === step) {
          return (
            <div style={{
              width: '10px', height: '10px', borderRadius: '9999px',
              background: '#C23B22'
            }} />
          );
        }
        return (
          <div style={{
            width: '8px', height: '8px', borderRadius: '9999px',
            background: 'rgba(120,120,128,0.2)'
          }} />
        );
      }

      function renderLine(i) {
        var color = i < step ? '#2D5016' : 'rgba(120,120,128,0.2)';
        return (
          <div style={{ width: '20px', height: '2px', background: color }} />
        );
      }

      var hasSummary = state.builder.bread || state.builder.meat || state.builder.cheese || state.builder.toppings.length > 0 || state.builder.condiments.length > 0;

      function isNextDisabled() {
        if (step >= 3) return false;
        var key = stepKeys[step];
        return !state.builder[key];
      }

      return (
        <div style={{ paddingBottom: '100px' }}>
          {/* Title */}
          <div style={{ fontSize: '22px', fontWeight: '700', textAlign: 'center', paddingTop: '16px', color: '#000' }}>
            Build Your Sandwich
          </div>

          {/* Step Indicator */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: '16px', paddingBottom: '8px', paddingLeft: '32px', paddingRight: '32px' }}>
            {[0,1,2,3,4,5].map(function(i) {
              return (
                <React.Fragment key={i}>
                  {renderDot(i)}
                  {i < 5 && renderLine(i)}
                </React.Fragment>
              );
            })}
          </div>
          <div style={{ fontSize: '13px', color: 'rgba(60,60,67,0.6)', textAlign: 'center', marginTop: '8px' }}>
            Step {step + 1} of 6 {"\u00B7"} {stepNames[step]}
          </div>

          {/* Running Summary (Steps 0-4 only) */}
          {step < 5 && hasSummary && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', paddingLeft: '16px', paddingRight: '16px', paddingTop: '8px', paddingBottom: '8px' }}>
              {state.builder.bread && (
                <span style={{ background: '#F2F2F7', fontSize: '12px', borderRadius: '9999px', paddingLeft: '10px', paddingRight: '10px', paddingTop: '4px', paddingBottom: '4px', color: '#000' }}>
                  {"\uD83C\uDF5E"} {state.builder.bread}
                </span>
              )}
              {state.builder.meat && (
                <span style={{ background: '#F2F2F7', fontSize: '12px', borderRadius: '9999px', paddingLeft: '10px', paddingRight: '10px', paddingTop: '4px', paddingBottom: '4px', color: '#000' }}>
                  {"\uD83E\uDD69"} {state.builder.meat}
                </span>
              )}
              {state.builder.cheese && (
                <span style={{ background: '#F2F2F7', fontSize: '12px', borderRadius: '9999px', paddingLeft: '10px', paddingRight: '10px', paddingTop: '4px', paddingBottom: '4px', color: '#000' }}>
                  {"\uD83E\uDDC0"} {state.builder.cheese}
                </span>
              )}
              {state.builder.toppings.map(function(t) {
                return (
                  <span key={t} style={{ background: '#F2F2F7', fontSize: '12px', borderRadius: '9999px', paddingLeft: '10px', paddingRight: '10px', paddingTop: '4px', paddingBottom: '4px', color: '#000' }}>
                    {"\uD83E\uDD6C"} {t}
                  </span>
                );
              })}
              {state.builder.condiments.map(function(c) {
                return (
                  <span key={c} style={{ background: '#F2F2F7', fontSize: '12px', borderRadius: '9999px', paddingLeft: '10px', paddingRight: '10px', paddingTop: '4px', paddingBottom: '4px', color: '#000' }}>
                    {"\uD83E\uDED9"} {c}
                  </span>
                );
              })}
            </div>
          )}

          {/* Steps 0-4: Selection */}
          {step < 5 && (
            <div>
              {/* Heading */}
              <div style={{ fontSize: '20px', fontWeight: '600', paddingLeft: '16px', paddingRight: '16px', paddingTop: '8px', paddingBottom: '4px', color: '#000' }}>
                Choose Your {stepNames[step]}
              </div>
              {isMultiSelect && (
                <div style={{ fontSize: '13px', color: 'rgba(60,60,67,0.6)', paddingLeft: '16px', paddingRight: '16px', paddingBottom: '8px' }}>
                  Select as many as you'd like
                </div>
              )}

              {/* Options Card */}
              <div style={{
                background: '#FFFFFF',
                borderRadius: '10px',
                marginLeft: '16px',
                marginRight: '16px',
                marginTop: '8px',
                overflow: 'hidden'
              }}>
                {optionArrays[step].map(function(option, i) {
                  var fieldKey = stepKeys[step];
                  var isSelected;
                  if (isMultiSelect) {
                    isSelected = state.builder[fieldKey].indexOf(option) > -1;
                  } else {
                    isSelected = state.builder[fieldKey] === option;
                  }

                  return (
                    <div key={option}>
                      <div
                        onClick={function() {
                          dispatch({ type: "SET_BUILDER_SELECTION", payload: { field: fieldKey, value: option } });
                        }}
                        className="active:opacity-70"
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          minHeight: '44px',
                          paddingLeft: '16px',
                          paddingRight: '16px',
                          cursor: 'pointer'
                        }}
                      >
                        {isMultiSelect && (
                          <div style={{
                            width: '22px',
                            height: '22px',
                            borderRadius: '9999px',
                            background: isSelected ? '#C23B22' : 'transparent',
                            border: isSelected ? 'none' : '2px solid rgba(120,120,128,0.3)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            flexShrink: 0
                          }}>
                            {isSelected && (
                              <span style={{ fontSize: '13px', color: 'white', fontWeight: 'bold', lineHeight: 1 }}>{"\u2713"}</span>
                            )}
                          </div>
                        )}
                        <span style={{
                          fontSize: '17px',
                          color: '#000',
                          flex: 1,
                          marginLeft: isMultiSelect ? '12px' : '0'
                        }}>
                          {option}
                        </span>
                        {isSingleSelect && isSelected && (
                          <Icon name="check" size={20} color="#C23B22" />
                        )}
                      </div>
                      {i < optionArrays[step].length - 1 && (
                        <div style={{ height: '0.5px', background: 'rgba(60,60,67,0.12)', marginLeft: '16px' }} />
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Navigation */}
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                paddingLeft: '16px',
                paddingRight: '16px',
                paddingTop: '16px'
              }}>
                {step > 0 ? (
                  <div
                    onClick={function() { dispatch({ type: "SET_BUILDER_STEP", payload: step - 1 }); }}
                    className="active:opacity-70"
                    style={{
                      fontSize: '17px',
                      color: '#C23B22',
                      cursor: 'pointer',
                      minHeight: '44px',
                      display: 'flex',
                      alignItems: 'center'
                    }}
                  >
                    Back
                  </div>
                ) : (
                  <div />
                )}
                <div
                  onClick={isNextDisabled() ? undefined : function() { dispatch({ type: "SET_BUILDER_STEP", payload: step + 1 }); }}
                  className={isNextDisabled() ? "" : "active:opacity-70"}
                  style={{
                    fontSize: '17px',
                    color: isNextDisabled() ? 'rgba(60,60,67,0.3)' : '#C23B22',
                    cursor: isNextDisabled() ? 'default' : 'pointer',
                    minHeight: '44px',
                    display: 'flex',
                    alignItems: 'center'
                  }}
                >
                  {step === 4 ? "Review" : "Next"}
                </div>
              </div>
            </div>
          )}

          {/* Step 5: Review */}
          {step === 5 && (
            <div>
              {/* Review Card */}
              <div style={{
                background: '#FFFFFF',
                borderRadius: '10px',
                marginLeft: '16px',
                marginRight: '16px',
                marginTop: '16px',
                overflow: 'hidden'
              }}>
                <div style={{ fontSize: '17px', fontWeight: '600', paddingLeft: '16px', paddingRight: '16px', paddingTop: '12px', paddingBottom: '12px' }}>
                  Your Sandwich
                </div>
                <div style={{ height: '0.5px', background: 'rgba(60,60,67,0.12)' }} />
                {[
                  { label: "Bread", value: state.builder.bread || "None" },
                  { label: "Meat", value: state.builder.meat || "None" },
                  { label: "Cheese", value: state.builder.cheese || "None" },
                  { label: "Toppings", value: state.builder.toppings.length > 0 ? state.builder.toppings.join(", ") : "None" },
                  { label: "Condiments", value: state.builder.condiments.length > 0 ? state.builder.condiments.join(", ") : "None" }
                ].map(function(row, i, arr) {
                  return (
                    <div key={row.label}>
                      <div style={{
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        minHeight: '44px',
                        paddingLeft: '16px',
                        paddingRight: '16px'
                      }}>
                        <span style={{ fontSize: '15px', color: 'rgba(60,60,67,0.6)' }}>{row.label}</span>
                        <span style={{ fontSize: '17px', color: '#000', textAlign: 'right', maxWidth: '60%' }}>{row.value}</span>
                      </div>
                      {i < arr.length - 1 && (
                        <div style={{ height: '0.5px', background: 'rgba(60,60,67,0.12)', marginLeft: '16px' }} />
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Name Input */}
              <div style={{ marginTop: '12px', marginLeft: '16px', marginRight: '16px' }}>
                <input
                  type="text"
                  placeholder="Name your sandwich (optional)"
                  value={state.builder.name}
                  onChange={function(e) {
                    dispatch({ type: "SET_BUILDER_SELECTION", payload: { field: "name", value: e.target.value } });
                  }}
                  style={{
                    width: '100%',
                    background: '#FFFFFF',
                    borderRadius: '10px',
                    border: '1px solid rgba(60,60,67,0.12)',
                    fontSize: '17px',
                    padding: '12px',
                    outline: 'none',
                    boxSizing: 'border-box'
                  }}
                />
              </div>

              {/* Add to Order Button */}
              <div style={{ marginTop: '16px', marginLeft: '16px', marginRight: '16px' }}>
                <button
                  onClick={function() {
                    dispatch({ type: "ADD_BYO_TO_CART" });
                    dispatch({ type: "SET_VIEW", payload: "cart" });
                  }}
                  className="active:opacity-70"
                  style={{
                    width: '100%',
                    background: '#C23B22',
                    color: 'white',
                    fontSize: '17px',
                    fontWeight: '600',
                    height: '50px',
                    borderRadius: '14px',
                    border: 'none',
                    cursor: 'pointer'
                  }}
                >
                  Add to Order
                </button>
              </div>

              {/* Start Over */}
              <div style={{ textAlign: 'center', paddingTop: '12px' }}>
                <span
                  onClick={function() { dispatch({ type: "RESET_BUILDER" }); }}
                  className="active:opacity-70"
                  style={{
                    fontSize: '17px',
                    color: 'rgba(60,60,67,0.6)',
                    cursor: 'pointer'
                  }}
                >
                  Start Over
                </span>
              </div>

              {/* Back to Step 5 nav */}
              <div style={{
                display: 'flex',
                justifyContent: 'flex-start',
                paddingLeft: '16px',
                paddingRight: '16px',
                paddingTop: '16px'
              }}>
                <div
                  onClick={function() { dispatch({ type: "SET_BUILDER_STEP", payload: 4 }); }}
                  className="active:opacity-70"
                  style={{
                    fontSize: '17px',
                    color: '#C23B22',
                    cursor: 'pointer',
                    minHeight: '44px',
                    display: 'flex',
                    alignItems: 'center'
                  }}
                >
                  Back
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       CART VIEW COMPONENT
       ============================================================ */
    function CartView({ state, dispatch }) {
      var cartCount = state.cart.reduce(function(sum, item) { return sum + item.quantity; }, 0);
      var itemLabel = cartCount === 1 ? "1 item" : cartCount + " items";

      // Empty State
      if (state.cart.length === 0 && !state.orderConfirmation) {
        return (
          <div style={{
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            minHeight: 'calc(100vh - 44px - 49px - env(safe-area-inset-top) - env(safe-area-inset-bottom))',
            padding: '20px'
          }}>
            <Icon name="shopping-cart" size={48} color="rgba(60,60,67,0.3)" />
            <div style={{ fontSize: '20px', fontWeight: '600', color: '#000', marginTop: '16px' }}>
              Your order is empty
            </div>
            <div style={{ fontSize: '15px', color: 'rgba(60,60,67,0.6)', marginTop: '6px', textAlign: 'center', paddingLeft: '32px', paddingRight: '32px' }}>
              Add items from the menu or build your own sandwich
            </div>
            <button
              onClick={function() { dispatch({ type: "SET_VIEW", payload: "menu" }); }}
              className="active:opacity-70"
              style={{
                marginTop: '20px',
                background: '#C23B22',
                color: 'white',
                fontSize: '17px',
                fontWeight: '600',
                height: '50px',
                paddingLeft: '32px',
                paddingRight: '32px',
                borderRadius: '14px',
                border: 'none',
                cursor: 'pointer'
              }}
            >
              Browse Menu
            </button>
          </div>
        );
      }

      // Order Confirmation State
      if (state.orderConfirmation) {
        var conf = state.orderConfirmation;
        return (
          <div style={{ paddingLeft: '24px', paddingRight: '24px', paddingBottom: '100px' }}>
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              paddingTop: '40px'
            }}>
              <div style={{
                width: '64px',
                height: '64px',
                borderRadius: '9999px',
                background: '#34C759',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center'
              }}>
                <Icon name="check" size={32} color="white" />
              </div>
              <div style={{ fontSize: '22px', fontWeight: '700', color: '#000', marginTop: '16px' }}>
                Order Received!
              </div>
              <div style={{ fontSize: '17px', color: 'rgba(60,60,67,0.6)', marginTop: '4px' }}>
                Order #{conf.orderNumber}
              </div>
            </div>

            {/* Order Items Card */}
            <div style={{
              background: '#FFFFFF',
              borderRadius: '10px',
              width: '100%',
              marginTop: '20px',
              overflow: 'hidden'
            }}>
              {conf.items.map(function(item, i) {
                return (
                  <div key={item.cartId || i}>
                    <div style={{
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      minHeight: '44px',
                      paddingLeft: '16px',
                      paddingRight: '16px'
                    }}>
                      <span style={{ fontSize: '17px', color: '#000' }}>{item.name}</span>
                      <span style={{ fontSize: '15px', color: 'rgba(60,60,67,0.6)' }}>{"\u00D7 "}{item.quantity}</span>
                    </div>
                    {i < conf.items.length - 1 && (
                      <div style={{ height: '0.5px', background: 'rgba(60,60,67,0.12)', marginLeft: '16px' }} />
                    )}
                  </div>
                );
              })}
            </div>

            {/* Note Card */}
            {conf.note && (
              <div style={{
                background: '#FFFFFF',
                borderRadius: '10px',
                width: '100%',
                marginTop: '10px',
                paddingLeft: '16px',
                paddingRight: '16px',
                paddingTop: '12px',
                paddingBottom: '12px'
              }}>
                <div style={{ fontSize: '13px', fontWeight: '600', color: 'rgba(60,60,67,0.6)' }}>Note</div>
                <div style={{ fontSize: '15px', color: '#000', marginTop: '4px' }}>{conf.note}</div>
              </div>
            )}

            {/* Info Text */}
            <div style={{ fontSize: '13px', color: 'rgba(60,60,67,0.6)', textAlign: 'center', marginTop: '16px' }}>
              We're preparing your order! Call or text us for pickup time.
            </div>

            {/* Contact Buttons */}
            <a
              href="tel:9142383553"
              className="active:opacity-70"
              style={{
                display: 'block',
                width: '100%',
                textAlign: 'center',
                background: '#C23B22',
                color: 'white',
                fontSize: '17px',
                fontWeight: '600',
                height: '50px',
                lineHeight: '50px',
                borderRadius: '14px',
                textDecoration: 'none',
                marginTop: '12px',
                boxSizing: 'border-box'
              }}
            >
              Call (914) 238-3553
            </a>
            <a
              href="sms:9143803532"
              className="active:opacity-70"
              style={{
                display: 'block',
                width: '100%',
                textAlign: 'center',
                background: '#2D5016',
                color: 'white',
                fontSize: '17px',
                fontWeight: '600',
                height: '50px',
                lineHeight: '50px',
                borderRadius: '14px',
                textDecoration: 'none',
                marginTop: '10px',
                boxSizing: 'border-box'
              }}
            >
              Text (914) 380-3532
            </a>

            {/* New Order */}
            <div style={{ textAlign: 'center', paddingTop: '16px' }}>
              <span
                onClick={function() {
                  dispatch({ type: "CLEAR_CONFIRMATION" });
                  dispatch({ type: "SET_VIEW", payload: "home" });
                }}
                className="active:opacity-70"
                style={{ fontSize: '17px', color: 'rgba(60,60,67,0.6)', cursor: 'pointer' }}
              >
                New Order
              </span>
            </div>
          </div>
        );
      }

      // Active Cart State
      return (
        <div style={{ paddingBottom: '100px' }}>
          {/* Title */}
          <div style={{ fontSize: '22px', fontWeight: '700', textAlign: 'center', paddingTop: '16px', color: '#000' }}>
            Your Order
          </div>
          <div style={{ fontSize: '13px', color: 'rgba(60,60,67,0.6)', textAlign: 'center', marginTop: '2px' }}>
            {itemLabel}
          </div>

          {/* Cart Items Card */}
          <div style={{
            background: '#FFFFFF',
            borderRadius: '10px',
            marginLeft: '16px',
            marginRight: '16px',
            marginTop: '16px',
            overflow: 'hidden'
          }}>
            {state.cart.map(function(item, i) {
              return (
                <div key={item.cartId}>
                  <div style={{
                    display: 'flex',
                    alignItems: 'center',
                    minHeight: '60px',
                    paddingTop: '10px',
                    paddingBottom: '10px',
                    paddingLeft: '16px',
                    paddingRight: '8px'
                  }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: '17px', fontWeight: '600', color: '#000' }}>{item.name}</div>
                      {item.description && (
                        <div style={{
                          fontSize: '13px',
                          color: 'rgba(60,60,67,0.6)',
                          marginTop: '2px',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis',
                          whiteSpace: 'nowrap'
                        }}>
                          {item.description}
                        </div>
                      )}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0' }}>
                      <div
                        onClick={function() {
                          dispatch({ type: "UPDATE_QUANTITY", payload: { cartId: item.cartId, quantity: item.quantity - 1 } });
                        }}
                        className="active:opacity-70"
                        style={{
                          cursor: 'pointer',
                          minWidth: '44px',
                          minHeight: '44px',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center'
                        }}
                      >
                        <Icon name="minus-circle" size={22} color="#C23B22" />
                      </div>
                      <span style={{ fontSize: '17px', fontWeight: '600', color: '#000', minWidth: '28px', textAlign: 'center' }}>
                        {item.quantity}
                      </span>
                      <div
                        onClick={function() {
                          dispatch({ type: "UPDATE_QUANTITY", payload: { cartId: item.cartId, quantity: item.quantity + 1 } });
                        }}
                        className="active:opacity-70"
                        style={{
                          cursor: 'pointer',
                          minWidth: '44px',
                          minHeight: '44px',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center'
                        }}
                      >
                        <Icon name="plus-circle" size={22} color="#C23B22" />
                      </div>
                    </div>
                  </div>
                  {i < state.cart.length - 1 && (
                    <div style={{ height: '0.5px', background: 'rgba(60,60,67,0.12)', marginLeft: '16px' }} />
                  )}
                </div>
              );
            })}
          </div>

          {/* Special Instructions */}
          <div style={{ marginTop: '12px', marginLeft: '16px', marginRight: '16px' }}>
            <div style={{ fontSize: '13px', fontWeight: '600', color: 'rgba(60,60,67,0.6)', marginBottom: '6px' }}>
              Special Instructions
            </div>
            <textarea
              value={state.cartNote}
              onChange={function(e) { dispatch({ type: "SET_CART_NOTE", payload: e.target.value }); }}
              placeholder="Allergies, modifications, pickup time..."
              style={{
                width: '100%',
                background: '#FFFFFF',
                borderRadius: '10px',
                border: '1px solid rgba(60,60,67,0.12)',
                fontSize: '17px',
                padding: '12px',
                outline: 'none',
                boxSizing: 'border-box',
                resize: 'none',
                minHeight: '80px',
                fontFamily: 'inherit'
              }}
            />
          </div>

          {/* Contact Section */}
          <div style={{ marginTop: '20px', marginLeft: '16px', marginRight: '16px' }}>
            <div style={{
              fontSize: '13px',
              fontWeight: '600',
              color: 'rgba(60,60,67,0.6)',
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
              marginBottom: '8px'
            }}>
              Send Your Order
            </div>
            <a
              href="tel:9142383553"
              className="active:opacity-70"
              style={{ textDecoration: 'none', display: 'block' }}
            >
              <div style={{
                background: '#FFFFFF',
                borderRadius: '10px',
                overflow: 'hidden',
                display: 'flex',
                alignItems: 'center',
                minHeight: '50px',
                paddingLeft: '16px',
                paddingRight: '16px'
              }}>
                <Icon name="phone" size={20} color="#C23B22" />
                <span style={{ flex: 1, marginLeft: '12px', fontSize: '17px', color: '#000' }}>Call to order</span>
                <Icon name="chevron-right" size={18} color="#8E8E93" />
              </div>
            </a>
            <a
              href="sms:9143803532"
              className="active:opacity-70"
              style={{ textDecoration: 'none', display: 'block', marginTop: '8px' }}
            >
              <div style={{
                background: '#FFFFFF',
                borderRadius: '10px',
                overflow: 'hidden',
                display: 'flex',
                alignItems: 'center',
                minHeight: '50px',
                paddingLeft: '16px',
                paddingRight: '16px'
              }}>
                <Icon name="message-square" size={20} color="#2D5016" />
                <span style={{ flex: 1, marginLeft: '12px', fontSize: '17px', color: '#000' }}>Text your order</span>
                <Icon name="chevron-right" size={18} color="#8E8E93" />
              </div>
            </a>
          </div>

          {/* Place Order Button */}
          <div style={{ marginTop: '16px', marginLeft: '16px', marginRight: '16px' }}>
            <button
              onClick={function() { dispatch({ type: "PLACE_ORDER" }); }}
              className="active:opacity-70"
              style={{
                width: '100%',
                background: '#C23B22',
                color: 'white',
                fontSize: '17px',
                fontWeight: '600',
                height: '50px',
                borderRadius: '14px',
                border: 'none',
                cursor: 'pointer'
              }}
            >
              Place Order
            </button>
          </div>

          {/* Clear Order */}
          <div style={{ textAlign: 'center', paddingTop: '12px' }}>
            <span
              onClick={function() { dispatch({ type: "CLEAR_CART" }); }}
              className="active:opacity-70"
              style={{ fontSize: '15px', color: 'rgba(60,60,67,0.6)', cursor: 'pointer' }}
            >
              Clear Order
            </span>
          </div>
        </div>
      );
    }

    /* ============================================================
       MAIN APP COMPONENT
       ============================================================ */
    function LangesApp() {
      var ref = React.useReducer(reducer, initialState);
      var state = ref[0];
      var dispatch = ref[1];
      var contentRef = React.useRef(null);

      // Scroll to top on view change
      React.useEffect(function() {
        if (contentRef.current) {
          contentRef.current.scrollTop = 0;
        }
      }, [state.activeView]);

      // Scroll to top on menu category change
      React.useEffect(function() {
        if (contentRef.current) {
          contentRef.current.scrollTop = 0;
        }
      }, [state.menuCategory]);

      // Scroll to top on builder step change
      React.useEffect(function() {
        if (contentRef.current) {
          contentRef.current.scrollTop = 0;
        }
      }, [state.builder.step]);

      // Clear toast after 1500ms
      React.useEffect(function() {
        if (state.toastMessage) {
          var timer = setTimeout(function() {
            dispatch({ type: "CLEAR_TOAST" });
          }, 1500);
          return function() { clearTimeout(timer); };
        }
      }, [state.toastMessage]);

      // Determine which view to render
      var viewContent;
      switch (state.activeView) {
        case "home":
          viewContent = <HomeView state={state} dispatch={dispatch} />;
          break;
        case "menu":
          viewContent = <MenuView state={state} dispatch={dispatch} />;
          break;
        case "builder":
          viewContent = <BuilderView state={state} dispatch={dispatch} />;
          break;
        case "cart":
          viewContent = <CartView state={state} dispatch={dispatch} />;
          break;
        case "catering":
          viewContent = <PlaceholderView title="Catering" />;
          break;
        default:
          viewContent = <PlaceholderView title="Home" />;
      }

      return (
        <div style={{ maxWidth: '448px', margin: '0 auto', position: 'relative', minHeight: '100vh', overflow: 'hidden' }}>
          <Header state={state} dispatch={dispatch} />
          <main
            ref={contentRef}
            className="scroll-area"
            style={{
              flex: 1,
              overflowY: 'auto',
              paddingTop: '0',
              paddingBottom: 'calc(49px + env(safe-area-inset-bottom))',
              background: '#F2F2F7',
              minHeight: 'calc(100vh - 44px - env(safe-area-inset-top))'
            }}
          >
            {viewContent}
          </main>
          <TabBar state={state} dispatch={dispatch} />
          <Toast message={state.toastMessage} />
        </div>
      );
    }

    /* ============================================================
       RENDER
       ============================================================ */
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(LangesApp)
    );
  </script>
</body>
</html>
